[package]
name = "pasque"
version = "0.4.0-dev"
edition = "2021"
license = "MIT"
description = "UDP and IP over HTTP/3"
authors = ["Pasi Sarolahti <pasi.sarolahti@iki.fi>"]
keywords = ["quic", "http3", "masque"]
readme = "README.md"
categories = ["network-programming"]
repository = "https://github.com/PasiSa/pasque"

[features]
tuntest = []

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
ipnetwork = "0.21"
jsonwebtoken = "9"
log = "0.4"
nix = { version = "0.29", features =["term", "fs"] }
octets = "0.3"
quiche = { version = "0.24", features = ["qlog"] }
ring = "0.17"
openssl-probe = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-util = "0.7"
tempfile = "3"
tun = { version = "0.7", features = ["async"] }
url = "2.5"
